*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);padding:18px 14px;z-index:50;display:flex;flex-direction:column}.brand{padding:4px 10px 20px}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;font-weight:750}.nav button:hover,.nav button.active{background:var(--soft);color:var(--p)}.tip{margin-top:auto;background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:13px;font-size:11px;color:var(--muted)}.main{margin-left:var(--side)}.top{height:64px;position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.title{font-weight:850}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn,.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 11px;font-weight:750}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.danger{background:var(--badbg);color:var(--bad);border-color:transparent}.btn.good{background:var(--goodbg);color:var(--good);border-color:transparent}.btn.sm{font-size:11px;padding:7px 9px}.icon{width:40px;height:40px;padding:0}.content{max-width:1400px;margin:auto;padding:22px 24px 60px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.card h2,.card h3{margin:0}.card h3{font-size:15px}.muted{color:var(--muted)}.tiny{font-size:10px}.small{font-size:12px}.hero{background:linear-gradient(135deg,#111827,#3730a3 70%,#6d28d9);color:#fff;border-radius:23px;padding:23px;overflow:hidden}.hero .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}.hero h1{margin:7px 0 4px;font-size:28px;letter-spacing:-.04em}.hero p{margin:0;color:#d9def0;font-size:13px;max-width:800px}.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:17px}.heroStat{background:#fff1;border:1px solid #fff2;border-radius:13px;padding:10px}.heroStat b{display:block;font-size:20px}.heroStat span{font-size:10px;color:#d8dcec}.metric{font-size:27px;font-weight:900;letter-spacing:-.04em}.label{font-size:11px;color:var(--muted)}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:850;background:var(--bg);border:1px solid var(--line)}.badge.good{color:var(--good);background:var(--goodbg);border-color:transparent}.badge.bad{color:var(--bad);background:var(--badbg);border-color:transparent}.badge.warn{color:var(--warn);background:var(--warnbg);border-color:transparent}.badge.info{color:var(--info);background:var(--infobg);border-color:transparent}.subject{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.subject:last-child{border:0}.dot{width:10px;height:10px;background:var(--p);border-radius:50%}.grow{flex:1}.subject b{font-size:13px}.subject small{display:block;color:var(--muted);font-size:10px}.slot{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--p);border-radius:10px;padding:9px;margin-top:7px}.slot.lab{border-left-color:var(--p2)}.slot b{font-size:11px}.slot small{display:block;color:var(--muted);font-size:9px}.schedule{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.day{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:170px}.day h4{margin:0 0 7px;font-size:12px}.day.today{box-shadow:inset 0 0 0 2px var(--p)}.statusline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:10px}.weekCard.current{box-shadow:0 0 0 2px var(--p),var(--shadow)!important}.todayBanner{padding:12px;border-radius:12px;background:var(--infobg);color:var(--info);font-size:11px;margin-bottom:14px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:var(--muted);font-size:10px;text-align:left;text-transform:uppercase;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:10px 9px;border-bottom:1px solid var(--line)}.table tr:last-child td{border:0}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.sessionGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.session{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:10px}.session.current{box-shadow:inset 0 0 0 2px var(--p)}.sessionTop{display:flex;justify-content:space-between;gap:8px}.session b{font-size:11px}.session small{display:block;color:var(--muted);font-size:9px}.sessionBtns{display:flex;gap:5px;margin-top:8px}.sessionBtns button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:10px;font-weight:850}.present{color:var(--good)}.absent{color:var(--bad)}.excused{color:var(--warn)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calhead{text-align:center;color:var(--muted);font-size:9px;font-weight:850;padding:5px}.calday{min-height:72px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px;cursor:pointer}.calday.today{box-shadow:inset 0 0 0 2px var(--p)}.calday.muted{opacity:.35}.calday b{font-size:10px}.event{font-size:8px;background:var(--soft);color:var(--p);border-radius:4px;padding:2px 3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:19px;height:19px}.tasktitle{font-size:12px;font-weight:800}.done{text-decoration:line-through;color:var(--muted)}.taskmeta{font-size:10px;color:var(--muted);margin-top:2px}.priority{font-size:9px;font-weight:900;padding:4px 6px;border-radius:6px}.high{background:var(--badbg);color:var(--bad)}.medium{background:var(--warnbg);color:var(--warn)}.low{background:var(--infobg);color:var(--info)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}.field textarea{min-height:100px}.note{padding:11px;border-radius:12px;background:var(--infobg);color:var(--info);font-size:11px}.warning{padding:11px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:11px}.dangerNote{padding:11px;border-radius:12px;background:var(--badbg);color:var(--bad);font-size:11px}.empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}.modalbg{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}.modalbg.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toast{position:fixed;right:15px;bottom:15px;background:var(--text);color:var(--bg);padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;opacity:0;transform:translateY(8px);transition:.2s;z-index:110}.toast.show{opacity:1;transform:none}.mobileNav{display:none}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.heroStats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{display:none}.main{margin:0}.top{height:58px;padding:0 12px}.content{padding:13px 11px 78px}.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.hero{padding:18px;border-radius:18px}.hero h1{font-size:23px}.schedule{grid-template-columns:1fr 1fr}.sessionGrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.mobileNav{display:grid;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:60;padding-bottom:env(safe-area-inset-bottom)}.mobileNav button{border:0;background:transparent;color:var(--muted);font-size:9px;padding:7px 2px}.mobileNav button.active{color:var(--p);font-weight:900}.mobileNav span{display:block;font-size:17px;line-height:17px}.calendar{gap:2px}.calday{min-height:58px}.statusline{align-items:flex-start;flex-direction:column}}
</style>

<body>
<aside class="sidebar"><div class="brand"><b>Semester OS</b><small>7th Semester · Fall 2026</small></div><nav class="nav" id="sideNav"></nav><div class="tip"><b>Rule:</b> don't carry the entire semester in your head. Track the next concrete action.</div></aside>
<div class="main"><header class="top"><div class="title" id="pageTitle">Dashboard</div><div class="actions"><button class="icon" id="themeBtn" title="Toggle theme">☾</button><button class="btn sm" onclick="quickAdd()">＋ Quick Add</button></div></header>
<main class="content"><section id="home" class="page active"></section><section id="attendance" class="page"></section><section id="timetable" class="page"></section><section id="calendar" class="page"></section><section id="tasks" class="page"></section><section id="focus" class="page"></section><section id="fyp" class="page"></section><section id="settings" class="page"></section></main></div>
<nav class="mobileNav" id="mobileNav"></nav><div class="toast" id="toast"></div><div class="modalbg" id="modal"><div class="modal" id="modalBody"></div></div>
<script>
const SUBJECTS=[
{id:'iot',name:'Internet of Things',short:'IoT',days:['Mon','Wed'],total:32,type:'Course'},
{id:'cloud',name:'Cloud Computing',short:'Cloud',days:['Tue','Wed'],total:32,type:'Course'},
{id:'ml',name:'Machine Learning',short:'ML',days:['Wed'],total:16,type:'Course'},
{id:'compiler',name:'Compiler Construction',short:'Compiler',days:['Mon','Tue'],total:32,type:'Course'},
{id:'cloudlab',name:'Cloud Computing Lab',short:'Cloud Lab',days:['Thu'],total:16,type:'Lab'},
{id:'mllab',name:'Machine Learning Lab',short:'ML Lab',days:['Thu'],total:16,type:'Lab'}];
const DAYS=['Mon','Tue','Wed','Thu'],DAYNUM={Mon:1,Tue:2,Wed:3,Thu:4},DAYNAME={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday'};
const START=new Date('2026-08-31T00:00:00'),END=new Date('2027-01-01T23:59:59');
const NAV=[['home','⌂','Dashboard'],['attendance','✓','Attendance'],['timetable','▦','Timetable'],['calendar','□','Calendar'],['tasks','☑','Tasks'],['focus','◷','Focus'],['fyp','⌁','FYP'],['settings','⚙','Settings']];
const KEY='semesterOS_advanced_v2';
const DEFAULT={theme:'light',page:'home',attendance:{},tasks:[],fyp:{progress:0,milestones:[['Scope & problem statement',false],['Literature review',false],['Architecture/design',false],['Debian gateway prototype',false],['Cloud layer implementation',false],['Latency & throughput experiments',false],['Analysis & final documentation',false]]},settings:{threshold:75,azure:'2026-10-12',finals:'2027-01-04'},focus:{minutes:25,seconds:1500,running:false,label:'Deep work'}};
let S=merge(DEFAULT,JSON.parse(localStorage.getItem(KEY)||'null')||{}),attTab='overview',calDate=new Date(),timer=null;
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){if(!b)return clone(a);const o=clone(a);for(const k in b)o[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?merge(o[k],b[k]):b[k];return o}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function iso(d){return new Date(d).toISOString().slice(0,10)}function dateFor(w,d){const x=new Date(START);x.setDate(x.getDate()+(w-1)*7+(DAYNUM[d]-1));return x}function short(d){return new Date(d).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}function fmt(d){return new Date(d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function currentWeek(){const now=new Date();if(now<START)return 0;if(now>END)return 17;const diff=Math.floor((new Date(iso(now)+'T12:00:00')-new Date(iso(START)+'T12:00:00'))/86400000);return Math.floor(diff/7)+1}function weekOf(){return Math.min(16,Math.max(1,currentWeek()||1))}function weekState(w){const cw=currentWeek();return w===cw?'current':w<cw?'past':'upcoming'}function dayIsToday(d,w){return iso(dateFor(w,d))===iso(new Date())}
function sessionDate(id,w,d){return dateFor(w,d)}function sessionState(id,w,d){const dt=sessionDate(id,w,d),now=new Date(),v=av(id,w,d);if(v!=='unmarked')return v;if(iso(dt)<iso(now))return 'pending';if(iso(dt)===iso(now))return 'today';return 'upcoming'}function key(id,w,d){return `${id}|${w}|${d}`}function av(id,w,d){return S.attendance[key(id,w,d)]||'unmarked'}
function stats(s){let p=0,a=0,e=0;for(let w=1;w<=16;w++)for(const d of s.days){const v=av(s.id,w,d);if(v==='present')p++;if(v==='absent')a++;if(v==='excused')e++}const marked=p+a+e,pct=marked?Math.round(p/marked*100):0,remaining=Math.max(0,s.total-Math.ceil(s.total*S.settings.threshold/100)-a);return{p,a,e,marked,pct,remaining,total:s.total}}
function weekStats(w){let p=0,a=0,e=0,marked=0,planned=0;SUBJECTS.forEach(s=>s.days.forEach(d=>{planned++;const v=av(s.id,w,d);if(v==='present'){p++;marked++}else if(v==='absent'){a++;marked++}else if(v==='excused'){e++;marked++}}));return{p,a,e,marked,planned,pct:marked?Math.round(p/marked*100):0}}
function overall(){let p=0,a=0,e=0;SUBJECTS.forEach(s=>{const x=stats(s);p+=x.p;a+=x.a;e+=x.e});const m=p+a+e;return{p,a,e,pct:m?Math.round(p/m*100):0,marked:m}}
function statCard(v,l,extra=''){return `<div class="card"><div class="metric">${v}</div><div class="label">${l}</div>${extra}</div>`}
function nav(){const mk=(mobile)=>NAV.slice(0,mobile?5:8).map(n=>`<button class="${S.page===n[0]?'active':''}" onclick="go('${n[0]}')">${mobile?`<span>${n[1]}</span>`:`${n[1]} `}${n[2]}</button>`).join('');document.getElementById('sideNav').innerHTML=mk(false);document.getElementById('mobileNav').innerHTML=mk(true);document.getElementById('pageTitle').textContent=(NAV.find(n=>n[0]===S.page)||NAV[0])[2]}
function go(p){S.page=p;save();render()}
function home(){const o=overall(),w=weekOf(),cw=currentWeek(),open=S.tasks.filter(x=>!x.done).length,done=S.fyp.milestones.filter(x=>x[1]).length,ws=weekStats(w),today=new Date(),dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][today.getDay()],todayClasses=(DAYS.includes(dn)&&cw>=1&&cw<=16)?SUBJECTS.filter(s=>s.days.includes(dn)) : [],status=cw===0?'Before semester':cw===17?'Semester complete':`Week ${cw} of 16`;document.getElementById('home').innerHTML=`<div class="hero"><div class="eyebrow">Fall 2026 · Academic Operating System</div><h1>${status}</h1><p>${cw>=1&&cw<=16?`Current week: ${short(dateFor(cw,'Mon'))} – ${short(dateFor(cw,'Thu'))}. Today is ${fmt(today)}.`:'Your semester timeline is automatically calculated from the configured calendar.'}</p><div class="heroStats"><div class="heroStat"><b>${o.pct}%</b><span>Semester attendance</span></div><div class="heroStat"><b>${ws.pct}%</b><span>Week ${w} attendance</span></div><div class="heroStat"><b>${open}</b><span>Open tasks</span></div><div class="heroStat"><b>${done}/${S.fyp.milestones.length}</b><span>FYP milestones</span></div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardhead"><div><h3>Today</h3><div class="small muted">${fmt(today)}</div></div><span class="badge info">${cw>=1&&cw<=16?`Week ${cw}`:'No active week'}</span></div>${todayClasses.length?todayClasses.map(s=>`<div class="subject"><div class="dot"></div><div class="grow"><b>${esc(s.name)}</b><small>${s.type} · ${s.days.join(' + ')}</small></div><span class="badge ${av(s.id,cw,dn)==='present'?'good':av(s.id,cw,dn)==='absent'?'bad':av(s.id,cw,dn)==='excused'?'warn':''}">${cw>=1&&cw<=16?sessionState(s.id,cw,dn):'—'}</span></div>`).join(''):'<div class="empty">No scheduled class today.</div>'}</div><div class="card"><div class="cardhead"><div><h3>Current week</h3><div class="small muted">Week ${w} · ${short(dateFor(w,'Mon'))} – ${short(dateFor(w,'Thu'))}</div></div><button class="btn sm" onclick="go('timetable')">Open timetable</button></div><div class="grid g4">${statCard(ws.marked,'Marked')}${statCard(ws.planned-ws.marked,'Unmarked')}${statCard(ws.a,'Absent')}${statCard(ws.pct+'%','Weekly %')}</div><div class="progress"><i style="width:${ws.planned?ws.marked/ws.planned*100:0}%"></i></div></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><div><h3>Semester progress</h3><div class="small muted">Week ${w} is automatically highlighted based on today's date.</div></div><span class="badge info">${cw>=1&&cw<=16?'LIVE':'Timeline'}</span></div><div class="grid g2">${Array.from({length:16},(_,i)=>{const ww=i+1,st=weekState(ww),x=weekStats(ww);return `<div class="weekCard ${st}" style="border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--bg)"><div class="cardhead" style="margin-bottom:6px"><b>Week ${ww} ${st==='current'?'· NOW':''}</b><span class="badge ${st==='current'?'info':''}">${x.marked}/${x.planned}</span></div><div class="tiny muted">${short(dateFor(ww,'Mon'))} – ${short(dateFor(ww,'Thu'))}</div><div class="progress"><i style="width:${x.planned?x.marked/x.planned*100:0}%"></i></div></div>`}).join('')}</div></div>`}
function scheduleHTML(w){const state=weekState(w);return `<div class="schedule">${DAYS.map(d=>`<div class="day ${dayIsToday(d,w)?'today':''}"><h4>${DAYNAME[d]} <span class="tiny muted">${short(dateFor(w,d))}</span> ${dayIsToday(d,w)?'<span class="badge info">Today</span>':''}</h4>${SUBJECTS.filter(s=>s.days.includes(d)).map(s=>`<div class="slot ${s.type==='Lab'?'lab':''}"><b>${esc(s.name)}</b><small>${s.type} · ${sessionState(s.id,w,d)}</small></div>`).join('')}</div>`).join('')}</div><div class="statusline"><span class="badge ${state==='current'?'info':state==='past'?'good':''}">${state==='current'?'● Current week':state==='past'?'✓ Past week':'○ Upcoming week'}</span><span class="tiny muted">${weekStats(w).marked}/${weekStats(w).planned} sessions marked</span></div>`}
function attendance(){let body;if(attTab==='overview'){const o=overall(),cw=currentWeek(),ws=weekStats(weekOf());body=`<div class="grid g4" style="margin-bottom:14px">${statCard(o.p,'Present')}${statCard(o.a,'Absent')}${statCard(o.e,'Excused')}${statCard(o.pct+'%','Marked attendance')}</div><div class="note" style="margin-bottom:12px">${cw>=1&&cw<=16?`Current week: <b>Week ${cw}</b> · ${short(dateFor(cw,'Mon'))} – ${short(dateFor(cw,'Thu'))} · ${ws.marked}/${ws.planned} sessions marked.`:'Semester is not currently in an active teaching week.'}</div><div class="tableWrap"><table class="table"><thead><tr><th>Subject</th><th>Total</th><th>P</th><th>A</th><th>%</th><th>Absences left</th><th></th></tr></thead><tbody>${SUBJECTS.map(s=>{const x=stats(s);return `<tr><td><b>${esc(s.name)}</b><div class="tiny muted">${s.days.join(' + ')} · ${s.type}</div></td><td>${x.total}</td><td>${x.p}</td><td>${x.a}</td><td><span class="badge ${x.pct>=S.settings.threshold?'good':'bad'}">${x.pct}%</span></td><td>${x.remaining}</td><td><button class="btn sm" onclick="attTab='${s.id}';render()">Track</button></td></tr>`}).join('')}</tbody></table></div>`}else{const s=SUBJECTS.find(x=>x.id===attTab),x=stats(s);body=`<div class="cardhead"><div><h3>${esc(s.name)}</h3><div class="small muted">${s.days.join(' + ')} · ${s.total} sessions · ${S.settings.threshold}% threshold</div></div><span class="badge ${x.remaining<=1?'warn':'good'}">${x.remaining} absence${x.remaining===1?'':'s'} left</span></div><div class="grid g4">${statCard(x.p,'Present')}${statCard(x.a,'Absent')}${statCard(x.e,'Excused')}${statCard(x.pct+'%','Attendance')}</div><div class="actions" style="margin:13px 0"><button class="btn primary" onclick="markSubject('${s.id}','present')">Mark all present</button><button class="btn" onclick="clearSubject('${s.id}')">Clear</button><button class="btn" onclick="attTab='overview';render()">← Overview</button></div><div class="sessionGrid">${sessions(s)}</div>`}document.getElementById('attendance').innerHTML=`<div class="tabs"><button class="btn ${attTab==='overview'?'primary':''}" onclick="attTab='overview';render()">Overview</button>${SUBJECTS.map(s=>`<button class="btn ${attTab===s.id?'primary':''}" onclick="attTab='${s.id}';render()">${esc(s.short)}</button>`).join('')}</div><div class="card">${body}</div>`}
function sessions(s){let h='';for(let w=1;w<=16;w++)for(const d of s.days){const v=av(s.id,w,d),state=sessionState(s.id,w,d),label=v==='unmarked'?(state==='pending'?'pending':state==='upcoming'?'upcoming':state==='today'?'today':'unmarked'):v;h+=`<div class="session ${dayIsToday(d,w)?'current':''}"><div class="sessionTop"><div><b>Week ${w} · ${d}</b><small>${short(dateFor(w,d))}${dayIsToday(d,w)?' · Today':''}</small></div><span class="badge ${v==='present'?'good':v==='absent'?'bad':v==='excused'?'warn':state==='pending'?'warn':state==='today'?'info':''}">${label}</span></div><div class="sessionBtns"><button class="present" onclick="setAv('${s.id}',${w},'${d}','present')">P</button><button class="absent" onclick="setAv('${s.id}',${w},'${d}','absent')">A</button><button class="excused" onclick="setAv('${s.id}',${w},'${d}','excused')">E</button><button onclick="setAv('${s.id}',${w},'${d}','unmarked')">–</button></div></div>`}return h}
function setAv(id,w,d,v){if(v==='unmarked')delete S.attendance[key(id,w,d)];else S.attendance[key(id,w,d)]=v;save();render()}function markSubject(id,v){const s=SUBJECTS.find(x=>x.id===id),cw=currentWeek();for(let w=1;w<=16;w++)for(const d of s.days)if(w<cw||(w===cw&&dateFor(w,d)<=new Date()))S.attendance[key(id,w,d)]=v;save();render();toast('Past/current attendance updated')}function clearSubject(id){if(!confirm('Clear all marks for this subject?'))return;const s=SUBJECTS.find(x=>x.id===id);for(let w=1;w<=16;w++)for(const d of s.days)delete S.attendance[key(id,w,d)];save();render()}
function timetable(){const w=weekOf(),cw=currentWeek();document.getElementById('timetable').innerHTML=`<div class="todayBanner"><b>Automatic week tracking:</b> ${cw>=1&&cw<=16?`Today is ${fmt(new Date())} → <b>Week ${cw}</b>. Week ${cw} is highlighted below.`:'The semester is not currently in an active teaching week.'}</div><div class="card"><div class="cardhead"><div><h3>Weekly timetable</h3><div class="small muted">${cw>=1&&cw<=16?`Week ${w} · ${short(dateFor(w,'Mon'))} – ${short(dateFor(w,'Thu'))}`:'Semester timeline'}</div></div><span class="badge info">Week ${w}</span></div>${scheduleHTML(w)}</div><div class="card" style="margin-top:14px"><div class="cardhead"><h3>16-week map</h3><span class="badge">${SUBJECTS.reduce((n,s)=>n+s.days.length,0)} sessions/week</span></div><div class="grid g2">${Array.from({length:16},(_,i)=>{const ww=i+1,st=weekState(ww),x=weekStats(ww);return `<div class="card weekCard ${st}"><div class="cardhead"><b>Week ${ww} ${st==='current'?'· NOW':''}</b><span class="badge ${st==='current'?'info':''}">${x.marked}/${x.planned} marked</span></div><div class="tiny muted">${short(dateFor(ww,'Mon'))} – ${short(dateFor(ww,'Thu'))} · ${st}</div><div class="progress"><i style="width:${x.planned?x.marked/x.planned*100:0}%"></i></div>${DAYS.map(d=>`<div class="tiny" style="margin-top:5px"><b>${d}</b> · ${SUBJECTS.filter(s=>s.days.includes(d)).map(s=>esc(s.short)).join(', ')}</div>`).join('')}</div>`}).join('')}</div></div>`}
function calendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div class="calday muted"></div>');for(let d=1;d<=last.getDate();d++){const date=new Date(y,m,d,12),isoD=iso(date),ev=events(date),cw=currentWeek(),w=Math.floor((date-START)/604800000)+1;cells.push(`<div class="calday ${isoD===iso(new Date())?'today':''} ${w===cw?'currentWeekDay':''}" onclick="openDate('${isoD}')"><b>${d}</b>${w===cw&&date>=START&&date<=END?'<div class="event">Current week</div>':''}${ev.slice(0,3).map(e=>`<div class="event">${esc(e)}</div>`).join('')}</div>`)}document.getElementById('calendar').innerHTML=`<div class="card"><div class="cardhead"><h3>Calendar</h3><div class="actions"><button class="btn sm" onclick="month(-1)">←</button><span class="badge">${calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><button class="btn sm" onclick="month(1)">→</button></div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardhead"><h3>University dates</h3></div><div class="subject"><div class="grow"><b>Semester</b><small>31 Aug 2026 – 1 Jan 2027</small></div></div><div class="subject"><div class="grow"><b>Midterms</b><small>26 – 30 Oct 2026</small></div></div><div class="subject"><div class="grow"><b>Final exams</b><small>4 – 8 Jan 2027</small></div></div><div class="subject"><div class="grow"><b>Course withdrawal</b><small>13 Nov 2026</small></div></div></div><div class="card"><div class="cardhead"><h3>Upcoming tasks</h3><button class="btn sm" onclick="quickAdd()">＋ Task</button></div>${S.tasks.filter(t=>t.due&&!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8).map(t=>`<div class="subject"><div class="grow"><b>${esc(t.title)}</b><small>${esc(t.due)}</small></div></div>`).join('')||'<div class="empty">Add tasks with due dates.</div>'}</div></div>`}
function events(date){const isoD=iso(date),e=[];if(isoD===S.settings.azure)e.push('Azure AI-103');if(isoD>='2026-10-26'&&isoD<='2026-10-30')e.push('Midterms');if(isoD>='2027-01-04'&&isoD<='2027-01-08')e.push('Final exams');if(isoD==='2026-11-13')e.push('Course withdrawal');S.tasks.filter(t=>t.due===isoD&&!t.done).forEach(t=>e.push(t.title));if(date>=START&&date<=END){const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()];SUBJECTS.filter(s=>s.days.includes(dn)).forEach(s=>e.push(s.short))}return e}function month(n){calDate.setMonth(calDate.getMonth()+n);render()}function openDate(isoD){openModal(`<div class="modalhead"><h3>${fmt(isoD)}</h3><button class="icon" onclick="closeModal()">×</button></div>${events(new Date(isoD+'T12:00:00')).map(e=>`<div class="subject"><div class="dot"></div><div class="grow"><b>${esc(e)}</b></div></div>`).join('')||'<div class="empty">No events.</div>'}`)}
function tasks(){const open=S.tasks.filter(x=>!x.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),done=S.tasks.filter(x=>x.done);document.getElementById('tasks').innerHTML=`<div class="card"><div class="cardhead"><div><h3>Tasks & assignments</h3><div class="small muted">${open.length} open · ${done.length} completed</div></div><button class="btn primary" onclick="quickAdd()">＋ Add task</button></div>${open.map(taskHTML).join('')||'<div class="empty">No open tasks.</div>'}${done.length?`<details style="margin-top:12px"><summary class="small muted">Completed (${done.length})</summary>${done.map(taskHTML).join('')}</details>`:''}</div>`}function taskHTML(t){return `<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow"><div class="tasktitle ${t.done?'done':''}">${esc(t.title)}</div><div class="taskmeta">${t.due?esc(t.due):'No due date'} · ${esc(t.category||'General')}</div></div><span class="priority ${t.priority||'medium'}">${esc(t.priority||'medium')}</span></div>`}function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function focus(){const mm=String(Math.floor(S.focus.seconds/60)).padStart(2,'0'),ss=String(S.focus.seconds%60).padStart(2,'0');document.getElementById('focus').innerHTML=`<div class="grid g2"><div class="card" style="text-align:center;padding:28px"><div class="small muted">${esc(S.focus.label)}</div><div id="timer" style="font-size:70px;font-weight:900;letter-spacing:-.06em;margin:8px 0">${mm}:${ss}</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="toggleTimer()">${S.focus.running?'Pause':'Start'}</button><button class="btn" onclick="resetTimer()">Reset</button></div><div class="actions" style="justify-content:center;margin-top:8px">${[15,25,50].map(x=>`<button class="btn sm" onclick="setTimer(${x})">${x} min</button>`).join('')}</div></div><div class="card"><div class="cardhead"><h3>Focus mode</h3></div><div class="field"><label>Label</label><input value="${esc(S.focus.label)}" onchange="S.focus.label=this.value;save()"></div><div class="note" style="margin-top:12px"><b>Minimum viable progress:</b> one focused 25-minute block is enough. Consistency beats heroic sessions.</div></div></div>`}function setTimer(m){S.focus.minutes=m;S.focus.seconds=m*60;S.focus.running=false;clearInterval(timer);save();render()}function toggleTimer(){if(S.focus.running){S.focus.running=false;clearInterval(timer);save();render();return}if(S.focus.seconds<=0)S.focus.seconds=S.focus.minutes*60;S.focus.running=true;save();render();clearInterval(timer);timer=setInterval(()=>{if(S.focus.seconds>0){S.focus.seconds--;save();const el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(S.focus.seconds/60)).padStart(2,'0')+':'+String(S.focus.seconds%60).padStart(2,'0')}else{S.focus.running=false;clearInterval(timer);save();toast('Focus block complete');render()}},1000)}function resetTimer(){S.focus.running=false;clearInterval(timer);S.focus.seconds=S.focus.minutes*60;save();render()}
function fyp(){const done=S.fyp.milestones.filter(x=>x[1]).length;document.getElementById('fyp').innerHTML=`<div class="hero"><div class="eyebrow">Final Year Project</div><h1>Self-Adaptive Hybrid Cloud–Fog Architecture</h1><p>Use this as an execution tracker for the project: scope → architecture → Debian gateway → cloud layer → experiments → evidence → documentation.</p><div class="progress" style="background:#fff3;height:10px;margin-top:16px"><i style="width:${S.fyp.progress}%;background:white"></i></div><div class="tiny" style="margin-top:5px;color:#d9def0">${S.fyp.progress}% · ${done}/${S.fyp.milestones.length} milestones</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="cardhead"><h3>Milestones</h3><span class="badge">${done}/${S.fyp.milestones.length}</span></div>${S.fyp.milestones.map((m,i)=>`<div class="task"><input type="checkbox" ${m[1]?'checked':''} onchange="fypToggle(${i})"><div class="grow"><div class="tasktitle ${m[1]?'done':''}">${esc(m[0])}</div></div></div>`).join('')}<div class="field" style="margin-top:12px"><label>Overall progress: ${S.fyp.progress}%</label><input type="range" min="0" max="100" value="${S.fyp.progress}" oninput="S.fyp.progress=Number(this.value);save();document.getElementById('fypPct').textContent=this.value+'%';document.getElementById('fypBar').style.width=this.value+'%'" id="fypRange"></div><div class="progress"><i id="fypBar" style="width:${S.fyp.progress}%"></i></div></div><div class="card"><div class="cardhead"><h3>Evidence checklist</h3></div>${['Architecture diagram','Debian gateway implementation','Cloud analytics/storage','Context-aware decision logic','Latency measurements','Throughput measurements','Baseline comparison','Screenshots / experiment proof','Research paper / final documentation'].map((x,i)=>`<div class="task"><input type="checkbox" id="ev${i}"><div class="grow"><div class="tasktitle">${x}</div></div></div>`).join('')}</div></div>`}function fypToggle(i){S.fyp.milestones[i][1]=!S.fyp.milestones[i][1];save();render()}
function settings(){document.getElementById('settings').innerHTML=`<div class="grid g2"><div class="card"><div class="cardhead"><h3>Appearance</h3></div><div class="field"><label>Theme</label><select onchange="S.theme=this.value;save();render()"><option value="light" ${S.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark</option></select></div><div class="note" style="margin-top:12px">Use the top-right button for a one-tap light/dark switch.</div></div><div class="card"><div class="cardhead"><h3>Academic settings</h3></div><div class="field"><label>Attendance threshold (%)</label><input type="number" min="1" max="100" value="${S.settings.threshold}" onchange="S.settings.threshold=Math.max(1,Math.min(100,Number(this.value)||75));save();render()"></div><div class="field" style="margin-top:10px"><label>Azure exam</label><input type="date" value="${S.settings.azure}" onchange="S.settings.azure=this.value;save();render()"></div><div class="field" style="margin-top:10px"><label>Final exam start</label><input type="date" value="${S.settings.finals}" onchange="S.settings.finals=this.value;save();render()"></div></div><div class="card"><div class="cardhead"><h3>Backup</h3></div><p class="small muted">Export all attendance, tasks, FYP and settings as JSON. Import it on another device.</p><div class="actions"><button class="btn primary" onclick="exportData()">Export backup</button><button class="btn" onclick="document.getElementById('file').click()">Import backup</button><input id="file" type="file" accept="application/json" hidden onchange="importData(event)"></div></div><div class="card"><div class="cardhead"><h3>Danger zone</h3></div><div class="dangerNote">Resetting deletes local app data. Export first.</div><button class="btn danger" style="margin-top:10px" onclick="resetAll()">Reset everything</button></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h3>Configured timetable</h3></div><div class="tableWrap"><table class="table"><thead><tr><th>Subject</th><th>Days</th><th>Total</th><th>Type</th><th>Max absences at ${S.settings.threshold}%</th></tr></thead><tbody>${SUBJECTS.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.days.join(' + ')}</td><td>${s.total}</td><td>${s.type}</td><td>${Math.max(0,s.total-Math.ceil(s.total*S.settings.threshold/100))}</td></tr>`).join('')}</tbody></table></div></div>`}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='semester-os-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(u);toast('Backup exported')}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=merge(DEFAULT,JSON.parse(r.result));save();render();toast('Backup imported')}catch(x){alert('Invalid backup file.')}};r.readAsText(f)}function resetAll(){if(confirm('Reset all local app data?')){S=clone(DEFAULT);save();render()}}
function quickAdd(){openModal(`<div class="modalhead"><h3>Add task</h3><button class="icon" onclick="closeModal()">×</button></div><div class="form"><div class="field full"><label>Task</label><input id="qt" placeholder="e.g. Revise Cloud Computing lecture"></div><div class="field"><label>Category</label><select id="qc"><option>University</option><option>Azure</option><option>FYP</option><option>Cloud/DevOps</option><option>Personal</option></select></div><div class="field"><label>Priority</label><select id="qp"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div><div class="field"><label>Due date</label><input id="qd" type="date"></div><div class="field"><label>Notes</label><input id="qn" placeholder="Optional"></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="addQuick()">Add task</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);document.getElementById('qt').focus()}function addQuick(){const title=document.getElementById('qt').value.trim();if(!title)return toast('Enter a task name');S.tasks.push({id:Date.now().toString(),title,due:document.getElementById('qd').value,category:document.getElementById('qc').value,priority:document.getElementById('qp').value,notes:document.getElementById('qn').value,done:false});save();closeModal();render();toast('Task added')}
function openModal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.getElementById('themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()};function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function render(){document.documentElement.dataset.theme=S.theme;nav();['home','attendance','timetable','calendar','tasks','focus','fyp','settings'].forEach(id=>document.getElementById(id).classList.toggle('active',S.page===id));home();attendance();timetable();calendar();tasks();focus();fyp();settings()}render();if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
